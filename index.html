<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reaction CPS Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f23;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 1rem;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: #a0a0c0;
        }
        #leaderboard {
            width: 100%;
            max-width: 340px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 0.8rem 1rem;
            margin-bottom: 1rem;
        }
        #leaderboard h2 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #f1c40f;
            margin-bottom: 0.6rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .leaderboard-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.4rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.95rem;
        }
        .leaderboard-row:last-child {
            border-bottom: none;
        }
        .leaderboard-row .rank {
            width: 24px;
            font-weight: 800;
            color: #8888aa;
        }
        .leaderboard-row.top .rank {
            color: #f1c40f;
        }
        .leaderboard-row .name {
            flex: 1;
            padding: 0 0.8rem;
            color: #fff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .leaderboard-row .time {
            font-weight: 700;
            color: #2ecc71;
            font-variant-numeric: tabular-nums;
        }
        .leaderboard-row.empty {
            color: #666699;
            justify-content: center;
            font-weight: 400;
        }
        #gameArea {
            width: 280px;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 1rem 0;
        }
        #circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: #e74c3c;
            box-shadow: 0 0 40px rgba(231, 76, 60, 0.4);
            cursor: pointer;
            transition: transform 0.08s ease, background 0.1s ease, box-shadow 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 700;
            text-align: center;
            padding: 1rem;
        }
        #circle.green {
            background: #2ecc71;
            box-shadow: 0 0 60px rgba(46, 204, 113, 0.6);
        }
        #circle:active {
            transform: scale(0.95);
        }
        #status {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            min-height: 1.5em;
            color: #c0c0d0;
            text-align: center;
        }
        #result {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            color: #fff;
        }
        #stats {
            display: flex;
            gap: 2rem;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            color: #8888aa;
        }
        .stat {
            text-align: center;
        }
        .stat span {
            display: block;
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
        }
        #btn {
            padding: 0.8rem 2rem;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            background: #3498db;
            color: #fff;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.08s ease;
            margin-bottom: 0.8rem;
        }
        #btn:hover {
            background: #2980b9;
        }
        #btn:active {
            transform: scale(0.96);
        }
        .too-soon {
            color: #e74c3c !important;
        }
        .not-top {
            color: #e67e22 !important;
        }
        .top-three {
            color: #f1c40f !important;
        }
        #resetLeaderboard {
            font-size: 0.75rem;
            color: #666699;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 0.4rem 0.8rem;
            cursor: pointer;
        }
        #resetLeaderboard:active {
            background: rgba(255, 255, 255, 0.08);
        }
        #nameModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 1rem;
        }
        #nameModal.active {
            display: flex;
        }
        .modal-box {
            background: #1a1a35;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 1.5rem;
            width: 100%;
            max-width: 320px;
            text-align: center;
        }
        .modal-box h3 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            color: #f1c40f;
        }
        .modal-box p {
            color: #a0a0c0;
            margin-bottom: 1rem;
            font-size: 0.95rem;
        }
        .modal-box input {
            width: 100%;
            padding: 0.8rem 1rem;
            font-size: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: #0f0f23;
            color: #fff;
            text-align: center;
            margin-bottom: 1rem;
            outline: none;
        }
        .modal-box input:focus {
            border-color: #f1c40f;
        }
        .modal-box button {
            width: 100%;
            padding: 0.8rem;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            background: #f1c40f;
            color: #0f0f23;
            cursor: pointer;
        }
        .modal-box button:active {
            transform: scale(0.98);
        }
        @media (max-width: 400px) {
            #circle {
                width: 160px;
                height: 160px;
            }
            #gameArea {
                width: 240px;
                height: 240px;
            }
        }
    </style>
</head>
<body>
    <h1>Reaction CPS Game</h1>

    <div id="leaderboard">
        <h2>🏆 Top 3 <button id="resetLeaderboard">Reset</button></h2>
        <div id="leaderboardRows"></div>
    </div>

    <div id="status">Tap Start, then wait for green...</div>
    <div id="gameArea">
        <div id="circle">TAP START</div>
    </div>
    <div id="result">-- ms</div>
    <div id="stats">
        <div class="stat">Average<span id="avg">--</span></div>
        <div class="stat">Best<span id="best">--</span></div>
        <div class="stat">CPS<span id="cps">--</span></div>
    </div>
    <button id="btn">Start</button>

    <div id="nameModal">
        <div class="modal-box">
            <h3>Top 3!</h3>
            <p id="modalTime">Your time: -- ms</p>
            <input type="text" id="nameInput" placeholder="Enter your name" maxlength="12" autocomplete="off">
            <button id="saveName">Save to Leaderboard</button>
        </div>
    </div>

    <script>
        const circle = document.getElementById('circle');
        const status = document.getElementById('status');
        const result = document.getElementById('result');
        const avgEl = document.getElementById('avg');
        const bestEl = document.getElementById('best');
        const cpsEl = document.getElementById('cps');
        const btn = document.getElementById('btn');
        const leaderboardRows = document.getElementById('leaderboardRows');
        const nameModal = document.getElementById('nameModal');
        const modalTime = document.getElementById('modalTime');
        const nameInput = document.getElementById('nameInput');
        const saveNameBtn = document.getElementById('saveName');
        const resetLeaderboardBtn = document.getElementById('resetLeaderboard');

        const STORAGE_KEY = 'cpsReactionLeaderboard';
        const MAX_LEADERS = 3;

        let state = 'idle'; // idle, waiting, green, result, nameInput
        let greenTime = 0;
        let timeoutId = null;
        let reactionTimes = [];
        let best = Infinity;
        let lastReaction = null;

        // --- Sound ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function beep(freq = 880, duration = 0.12, type = 'sine') {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
            osc.start(now);
            osc.stop(now + duration);
        }
        function playGreenSound() { beep(880, 0.12, 'sine'); }
        function playTooSoonSound() { beep(220, 0.25, 'sawtooth'); }
        function playTopThreeSound() { beep(1320, 0.18, 'square'); }

        // --- Leaderboard ---
        function loadLeaderboard() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch (e) {
                return [];
            }
        }
        function saveLeaderboard(list) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
        }
        function renderLeaderboard() {
            const list = loadLeaderboard();
            leaderboardRows.innerHTML = '';
            if (list.length === 0) {
                const row = document.createElement('div');
                row.className = 'leaderboard-row empty';
                row.textContent = 'No records yet — be the first!';
                leaderboardRows.appendChild(row);
                return;
            }
            list.forEach((entry, i) => {
                const row = document.createElement('div');
                row.className = 'leaderboard-row' + (i === 0 ? ' top' : '');
                row.innerHTML = `
                    <span class="rank">#${i + 1}</span>
                    <span class="name">${escapeHtml(entry.name)}</span>
                    <span class="time">${entry.time} ms</span>
                `;
                leaderboardRows.appendChild(row);
            });
            // Pad empty slots
            for (let i = list.length; i < MAX_LEADERS; i++) {
                const row = document.createElement('div');
                row.className = 'leaderboard-row empty';
                row.innerHTML = `<span class="rank">#${i + 1}</span><span class="name">--</span><span class="time">--</span>`;
                leaderboardRows.appendChild(row);
            }
        }
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        function isTopThree(time) {
            const list = loadLeaderboard();
            if (list.length < MAX_LEADERS) return true;
            return time < list[list.length - 1].time;
        }
        function addLeader(name, time) {
            const list = loadLeaderboard();
            list.push({ name, time, date: new Date().toISOString() });
            list.sort((a, b) => a.time - b.time);
            saveLeaderboard(list.slice(0, MAX_LEADERS));
            renderLeaderboard();
        }

        // --- Game ---
        function reset() {
            clearTimeout(timeoutId);
            state = 'idle';
            circle.classList.remove('green');
            circle.textContent = 'TAP START';
            status.textContent = 'Tap Start, then wait for green...';
            status.classList.remove('too-soon', 'not-top', 'top-three');
            result.textContent = '-- ms';
        }

        function startRound() {
            if (state === 'nameInput') return;
            reset();
            state = 'waiting';
            circle.textContent = 'WAIT...';
            status.textContent = 'Wait for it to turn green...';
            circle.classList.remove('green');

            const delay = 1500 + Math.random() * 2500; // 1.5 - 4s
            timeoutId = setTimeout(() => {
                state = 'green';
                greenTime = performance.now();
                circle.classList.add('green');
                circle.textContent = 'PRESS!';
                status.textContent = 'NOW! Tap the circle!';
                playGreenSound();
            }, delay);
        }

        function showNameInput(time) {
            state = 'nameInput';
            lastReaction = time;
            modalTime.textContent = 'Your time: ' + time + ' ms';
            nameInput.value = '';
            nameModal.classList.add('active');
            nameInput.focus();
            playTopThreeSound();
        }

        function submitName() {
            const name = nameInput.value.trim();
            if (!name) return;
            addLeader(name, lastReaction);
            nameModal.classList.remove('active');
            status.textContent = 'Saved! Tap circle or Start to retry.';
            status.classList.add('top-three');
            state = 'result';
            circle.textContent = 'AGAIN';
        }

        function handleTap() {
            if (state === 'idle') {
                startRound();
                return;
            }
            if (state === 'waiting') {
                clearTimeout(timeoutId);
                state = 'idle';
                circle.classList.remove('green');
                circle.textContent = 'TOO SOON';
                status.textContent = 'Too soon! Tap circle to retry.';
                status.classList.add('too-soon');
                status.classList.remove('not-top', 'top-three');
                result.textContent = '-- ms';
                playTooSoonSound();
                return;
            }
            if (state === 'green') {
                const endTime = performance.now();
                const reaction = Math.round(endTime - greenTime);
                state = 'result';
                circle.classList.remove('green');
                result.textContent = reaction + ' ms';

                reactionTimes.push(reaction);
                const avg = Math.round(reactionTimes.reduce((a, b) => a + b, 0) / reactionTimes.length);
                avgEl.textContent = avg + ' ms';
                if (reaction < best) best = reaction;
                bestEl.textContent = best + ' ms';
                cpsEl.textContent = (1000 / reaction).toFixed(1);

                if (isTopThree(reaction)) {
                    circle.textContent = 'TOP 3!';
                    status.textContent = 'Top 3! Enter your name.';
                    status.classList.add('top-three');
                    status.classList.remove('too-soon', 'not-top');
                    showNameInput(reaction);
                } else {
                    circle.textContent = 'RETRY';
                    status.textContent = 'Not top 3. Restarting...';
                    status.classList.add('not-top');
                    status.classList.remove('too-soon', 'top-three');
                    setTimeout(() => {
                        if (state === 'result') startRound();
                    }, 1500);
                }
                return;
            }
            if (state === 'result') {
                startRound();
            }
        }

        circle.addEventListener('click', handleTap);
        circle.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleTap();
        }, { passive: false });

        btn.addEventListener('click', startRound);

        saveNameBtn.addEventListener('click', submitName);
        nameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') submitName();
        });
        nameModal.addEventListener('click', (e) => {
            if (e.target === nameModal) {
                // clicking outside modal just closes and lets user restart
                nameModal.classList.remove('active');
                reset();
            }
        });

        resetLeaderboardBtn.addEventListener('click', () => {
            if (confirm('Clear all leaderboard records?')) {
                localStorage.removeItem(STORAGE_KEY);
                renderLeaderboard();
            }
        });

        // Prevent zoom on double tap
        document.addEventListener('touchend', (e) => e.preventDefault(), { passive: false });

        renderLeaderboard();
    </script>
</body>
</html>
