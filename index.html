<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reaction CPS Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f23;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #a0a0c0;
        }
        #gameArea {
            width: 280px;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 1.5rem 0;
        }
        #circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: #e74c3c;
            box-shadow: 0 0 40px rgba(231, 76, 60, 0.4);
            cursor: pointer;
            transition: transform 0.08s ease, background 0.1s ease, box-shadow 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 700;
            text-align: center;
            padding: 1rem;
        }
        #circle.green {
            background: #2ecc71;
            box-shadow: 0 0 60px rgba(46, 204, 113, 0.6);
        }
        #circle:active {
            transform: scale(0.95);
        }
        #status {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            min-height: 1.5em;
            color: #c0c0d0;
        }
        #result {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            color: #fff;
        }
        #stats {
            display: flex;
            gap: 2rem;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            color: #8888aa;
        }
        .stat {
            text-align: center;
        }
        .stat span {
            display: block;
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
        }
        #btn {
            padding: 0.8rem 2rem;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            background: #3498db;
            color: #fff;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.08s ease;
        }
        #btn:hover {
            background: #2980b9;
        }
        #btn:active {
            transform: scale(0.96);
        }
        .too-soon {
            color: #e74c3c !important;
        }
        @media (max-width: 400px) {
            #circle {
                width: 160px;
                height: 160px;
            }
            #gameArea {
                width: 240px;
                height: 240px;
            }
        }
    </style>
</head>
<body>
    <h1>Reaction CPS Game</h1>
    <div id="status">Tap Start, then wait for green...</div>
    <div id="gameArea">
        <div id="circle">TAP START</div>
    </div>
    <div id="result">-- ms</div>
    <div id="stats">
        <div class="stat">Average<span id="avg">--</span></div>
        <div class="stat">Best<span id="best">--</span></div>
        <div class="stat">CPS<span id="cps">--</span></div>
    </div>
    <button id="btn">Start</button>

    <script>
        const circle = document.getElementById('circle');
        const status = document.getElementById('status');
        const result = document.getElementById('result');
        const avgEl = document.getElementById('avg');
        const bestEl = document.getElementById('best');
        const cpsEl = document.getElementById('cps');
        const btn = document.getElementById('btn');

        let state = 'idle'; // idle, waiting, green, result
        let startTime = 0;
        let greenTime = 0;
        let timeoutId = null;
        let reactionTimes = [];
        let best = Infinity;

        function reset() {
            clearTimeout(timeoutId);
            state = 'idle';
            circle.classList.remove('green');
            circle.textContent = 'TAP START';
            status.textContent = 'Tap Start, then wait for green...';
            status.classList.remove('too-soon');
            result.textContent = '-- ms';
        }

        function startRound() {
            reset();
            state = 'waiting';
            circle.textContent = 'WAIT...';
            status.textContent = 'Wait for it to turn green...';
            circle.classList.remove('green');
            
            const delay = 1500 + Math.random() * 2500; // 1.5 - 4s
            startTime = performance.now();
            timeoutId = setTimeout(() => {
                state = 'green';
                greenTime = performance.now();
                circle.classList.add('green');
                circle.textContent = 'PRESS!';
                status.textContent = 'NOW! Tap the circle!';
            }, delay);
        }

        function handleTap() {
            if (state === 'idle') {
                startRound();
                return;
            }
            if (state === 'waiting') {
                clearTimeout(timeoutId);
                state = 'idle';
                circle.classList.remove('green');
                circle.textContent = 'TOO SOON';
                status.textContent = 'Too soon! Tap circle to retry.';
                status.classList.add('too-soon');
                result.textContent = '-- ms';
                return;
            }
            if (state === 'green') {
                const endTime = performance.now();
                const reaction = Math.round(endTime - greenTime);
                state = 'result';
                circle.classList.remove('green');
                circle.textContent = 'AGAIN';
                status.textContent = 'Good reaction! Tap circle for next round.';
                status.classList.remove('too-soon');
                result.textContent = reaction + ' ms';
                
                reactionTimes.push(reaction);
                const avg = Math.round(reactionTimes.reduce((a, b) => a + b, 0) / reactionTimes.length);
                avgEl.textContent = avg + ' ms';
                if (reaction < best) best = reaction;
                bestEl.textContent = best + ' ms';
                // CPS = 1 second / average reaction time in seconds
                cpsEl.textContent = (1000 / reaction).toFixed(1);
                return;
            }
            if (state === 'result') {
                startRound();
            }
        }

        circle.addEventListener('click', handleTap);
        circle.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleTap();
        }, { passive: false });

        btn.addEventListener('click', startRound);

        // Prevent zoom on double tap
        document.addEventListener('touchend', (e) => e.preventDefault(), { passive: false });
    </script>
</body>
</html>
